<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f3f5f7">
<meta name="description" content="坦白局 · 今天一人问一个问题，我全部如实回答">
<title>坦白局 · 今天一人问一个问题</title>
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/icons.css">
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/home">
        <span class="brand-block" id="brandMark"></span>
        <span>坦白局</span>
      </a>

      <nav class="topnav" aria-label="主导航">
        <a href="#/home" data-route="home">广场</a>
        <a href="#/feed" data-route="feed">动态</a>
        <a href="#/discover" data-route="discover">发现</a>
        <a href="#/create" data-route="create">发起</a>
        <a href="#/messages" data-route="messages">通知</a>
        <a href="#/me" data-route="me">我的</a>
      </nav>

      <div class="topbar-right">
        <button class="icon-btn" id="searchBtn" title="搜索" aria-label="搜索"></button>
        <a class="icon-btn" href="#/messages" title="通知" aria-label="通知">
          <span class="rel"><span id="bellIcon"></span><span class="badge-dot hidden" id="unreadBadge">0</span></span>
        </a>
        <a class="user-chip" href="#/me" id="userChip">
          <span id="userAvatar"></span>
          <span class="nick t-sm bold" id="userName">登录</span>
        </a>
      </div>
    </div>
  </header>

  <main class="shell" id="view">
    <div class="col gap-16">
      <div class="skel" style="height:150px;border-radius:12px"></div>
      <div class="skel" style="height:300px;border-radius:10px"></div>
    </div>
  </main>
</div>

<nav class="tabbar" aria-label="底部导航">
  <a href="#/home" data-route="home" aria-label="广场">
    <span class="tab-ico" data-ico="home"></span>
    广场
  </a>
  <a href="#/create" data-route="create" aria-label="发起">
    <span class="tab-fab" data-ico="plus"></span>
    <span class="tab-fab-label">发起</span>
  </a>
  <a href="#/messages" data-route="messages" aria-label="通知">
    <span class="tab-ico rel">
      <span data-ico="bell"></span>
      <span class="badge-dot hidden" id="unreadBadgeM">0</span>
    </span>
    通知
  </a>
  <a href="#/me" data-route="me" aria-label="我的">
    <span class="tab-ico" data-ico="user"></span>
    我的
  </a>
</nav>

<script src="/js/core/icons.js"></script>
<script src="/js/core/store.js"></script>
<script src="/js/core/ui.js"></script>
<script src="/js/core/local-data.js"></script>
<script src="/js/core/supabase-data.js"></script>
<script src="/js/core/api.js"></script>
<script src="/js/core/router.js"></script>
<script src="/vendor/qr.js"></script>
<script src="/js/core/qr-view.js"></script>
<script src="/js/modules/home.js"></script>
<script src="/js/modules/room.js"></script>
<script src="/js/modules/create.js"></script>
<script src="/js/modules/me.js"></script>
<script src="/js/modules/messages.js"></script>
<script src="/js/modules/social.js"></script>
<script src="/js/modules/login.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
