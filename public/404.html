<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>坦白局</title>
<style>
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: #f3f5f7;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #17191c; text-align: center; padding: 24px;
  }
  .box { max-width: 340px; }
  .mark {
    width: 56px; height: 56px; margin: 0 auto 20px;
    border-radius: 16px; background: #ffe066;
    display: grid; place-items: center;
    font-size: 26px; font-weight: 800;
  }
  h1 { font-size: 19px; margin: 0 0 8px; }
  p { color: #5b6169; font-size: 14px; line-height: 1.7; margin: 0 0 22px; }
  a {
    display: inline-block; padding: 11px 26px; border-radius: 999px;
    background: #07c160; color: #fff; text-decoration: none;
    font-size: 15px; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">坦</div>
    <h1>页面走丢了</h1>
    <p>你打开的链接不存在。<br>回到广场看看别人都在问什么吧。</p>
    <a href="/">回到广场</a>
  </div>
  <script>
    // 用会话存储把原路径带回去，实现「点通知/分享链接回来后仍在原页面」
    (function () {
      try {
        var target = location.pathname + location.search + location.hash;
        sessionStorage.setItem('tb_intended', target);
      } catch (e) { /* 隐私模式下可能不可用，忽略 */ }
    })();
  </script>
</body>
</html>
